name: Monthly Core Web Vitals Pull (UK)

on:
  schedule:
    # 8:19am America/New_York = 12:19 UTC, 2nd of each month, a few minutes
    # after the US run so the two Lighthouse/Chrome sweeps don't overlap on
    # the shared runner pool.
    - cron: "19 12 2 * *"
  workflow_dispatch: {} # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write # needed to commit data/ state files back to the repo

concurrency:
  group: monthly-core-web-vitals-uk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Run monthly Core Web Vitals pull (UK)
        env:
          REGION: uk
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run monthly

      - name: Commit updated state
        run: |
          git config user.name "havwoods-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update UK CWV state [skip ci]"
          git push
