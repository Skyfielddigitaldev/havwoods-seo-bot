name: Weekly GEO / AI Search Tracking

on:
  schedule:
    # 8:20am America/New_York = 12:20 UTC, every Monday. Offset from the
    # other weekly job (8:07am) so they don't start at the exact same
    # minute on the shared runner pool.
    - cron: "20 12 * * 1"
  workflow_dispatch: {} # lets you trigger a manual test run from the Actions tab

concurrency:
  group: weekly-geo-ai-tracking
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run GEO / AI search tracking pull
        env:
          OTTERLY_API_KEY: ${{ secrets.OTTERLY_API_KEY }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: npm run geo-ai-tracking
