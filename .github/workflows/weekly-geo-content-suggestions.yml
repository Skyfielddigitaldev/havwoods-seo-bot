name: Weekly GEO Content Suggestions

on:
  schedule:
    # 8:34am America/New_York = 12:34 UTC, every Monday.
    - cron: "34 12 * * 1"
  workflow_dispatch: {} # lets you trigger a manual test run from the Actions tab

concurrency:
  group: weekly-geo-content-suggestions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run GEO content-gap pull
        env:
          OTTERLY_API_KEY: ${{ secrets.OTTERLY_API_KEY }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: npm run geo-content-suggestions
