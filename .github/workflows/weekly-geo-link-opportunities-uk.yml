name: Weekly GEO Link Opportunities (UK)

on:
  schedule:
    # 8:30am America/New_York = 12:30 UTC, every Monday. Offset from the US
    # twin (8:27am) and the other weekly jobs so they don't start at the
    # exact same minute on the shared runner pool.
    - cron: "30 12 * * 1"
  workflow_dispatch: {} # lets you trigger a manual test run from the Actions tab

concurrency:
  group: weekly-geo-link-opportunities-uk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run GEO link-opportunity pull (UK)
        env:
          REGION: uk
          OTTERLY_API_KEY: ${{ secrets.OTTERLY_API_KEY }}
          OTTERLY_REPORT_ID_UK: ${{ secrets.OTTERLY_REPORT_ID_UK }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: npm run geo-link-opportunities:uk
