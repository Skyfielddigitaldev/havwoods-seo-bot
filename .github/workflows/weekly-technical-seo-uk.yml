name: Weekly Technical SEO Sync (UK)

on:
  schedule:
    # 8:11am America/New_York = 12:11 UTC, a few minutes after the US run so
    # the two don't hit the Semrush API or the shared runner pool at the
    # exact same moment.
    - cron: "11 12 * * 1"
  workflow_dispatch: {} # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write # needed to commit data/ state files back to the repo

concurrency:
  group: weekly-technical-seo-uk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run weekly technical SEO sync (UK)
        env:
          REGION: uk
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
          SEMRUSH_PROJECT_ID: ${{ vars.SEMRUSH_PROJECT_ID }}
          SEMRUSH_PROJECT_ID_UK: ${{ vars.SEMRUSH_PROJECT_ID_UK }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: npm run weekly

      - name: Commit updated state
        run: |
          git config user.name "havwoods-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update UK technical SEO state [skip ci]"
          git push
